# Mini App uchun nginx sozlamasi.
#
# Bu fayl 443-blokda ssl_certificate yo'liga to'g'ridan-to'g'ri ishora
# qiladi, shuning uchun uni certbot sertifikat OLGANDAN KEYIN o'rnatish
# kerak — aks holda `nginx -t` fayl hali mavjud bo'lmagan sertifikatga
# ishora qilgani uchun yiqiladi (`certbot --nginx` esa reload qilib
# challenge'ni ushbu nginx orqali javob berishga urinadi, ya'ni allaqachon
# buzilgan configni tuzata olmaydi — tuxum-tovuq muammosi).
#
# To'g'ri ketma-ketlik:
#
#   1. Vaqtinchalik, faqat 80-portli minimal fayl bilan sertifikat oling
#      (bu bosqichda 443-blok umuman kerak emas):
#
#        cat <<'EOF' | sudo tee /etc/nginx/sites-available/davomat
#        server {
#            listen 80;
#            listen [::]:80;
#            server_name davomat.example.uz;
#            location / { return 200 'ok'; }
#        }
#        EOF
#        sudo ln -sf /etc/nginx/sites-available/davomat /etc/nginx/sites-enabled/davomat
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot certonly --nginx -d davomat.example.uz
#
#   2. Sertifikat tayyor bo'lgach, shu faylni to'liq holda o'rnating
#      (server_name VA ssl_certificate yo'llaridagi domenni almashtiring):
#
#        sudo cp deploy/nginx-davomat.conf /etc/nginx/sites-available/davomat
#        sudo sed -i 's/davomat.example.uz/SIZNING-DOMENINGIZ/g' \
#            /etc/nginx/sites-available/davomat
#        sudo nginx -t && sudo systemctl reload nginx
#
# certbot.timer sertifikatni o'zi yangilab turadi — qayta ishga
# tushirish shart emas (nginx allaqachon shu yo'llarni o'qiydi).

server {
    listen 80;
    listen [::]:80;
    server_name davomat.example.uz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name davomat.example.uz;

    ssl_certificate /etc/letsencrypt/live/davomat.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davomat.example.uz/privkey.pem;

    root /var/www/davomat;
    index index.html;

    # ─── Xavfsizlik sarlavhalari ────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # DIQQAT: X-Frame-Options QO'YMANG.
    # Telegram Web da Mini App iframe ichida ochiladi va DENY/SAMEORIGIN
    # uni butunlay bloklaydi. Mobil ilovalarda WebView bo'lgani uchun
    # muammo sezilmaydi — xato faqat brauzerdagi Telegramda chiqadi.

    # ─── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rasm yuklash uchun. nginx dagi standart chegara 1 MB va u
        # 10 MB lik rasmni 413 bilan qaytarib yuborardi.
        client_max_body_size 12m;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ─── Statik fayllar ─────────────────────────────────────────────────────
    # Vite fayl nomiga hash qo'shadi, shuning uchun uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri /index.html;
        # index.html keshlanmasin, aks holda yangi versiya chiqqach ham
        # foydalanuvchida eskisi ochilib turadi
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/davomat.access.log;
    error_log /var/log/nginx/davomat.error.log;
}
