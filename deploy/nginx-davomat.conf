# Mini App uchun nginx sozlamasi.
#
#   sudo cp deploy/nginx-davomat.conf /etc/nginx/sites-available/davomat
#   sudo ln -s /etc/nginx/sites-available/davomat /etc/nginx/sites-enabled/
#   # davomat.example.uz o'rniga o'z domeningizni yozing
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d davomat.example.uz
#
# certbot 443-blokni va sertifikat yo'llarini o'zi to'ldiradi.

server {
    listen 80;
    listen [::]:80;
    server_name davomat.example.uz;

    # certbot shu blokni HTTPS ga yo'naltirish bilan almashtiradi
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name davomat.example.uz;

    # ssl_certificate / ssl_certificate_key ni certbot qo'shadi

    root /var/www/davomat;
    index index.html;

    # ─── Xavfsizlik sarlavhalari ────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # DIQQAT: X-Frame-Options QO'YMANG.
    # Telegram Web da Mini App iframe ichida ochiladi va DENY/SAMEORIGIN
    # uni butunlay bloklaydi. Mobil ilovalarda WebView bo'lgani uchun
    # muammo sezilmaydi — xato faqat brauzerdagi Telegramda chiqadi.

    # ─── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rasm yuklash uchun. nginx dagi standart chegara 1 MB va u
        # 10 MB lik rasmni 413 bilan qaytarib yuborardi.
        client_max_body_size 12m;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ─── Statik fayllar ─────────────────────────────────────────────────────
    # Vite fayl nomiga hash qo'shadi, shuning uchun uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri /index.html;
        # index.html keshlanmasin, aks holda yangi versiya chiqqach ham
        # foydalanuvchida eskisi ochilib turadi
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/davomat.access.log;
    error_log /var/log/nginx/davomat.error.log;
}
