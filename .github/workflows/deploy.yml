name: Deploy to VPS

on:
  push:
    branches:
      - main

# Ikki deploy bir vaqtda ketmasin — migratsiya o'rtasida ikkinchisi
# boshlansa baza noaniq holatda qolishi mumkin.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ─── Mini App ────────────────────────────────────────────────────────
      # Frontend shu yerda yig'iladi, VPS ga Node o'rnatish shart emas.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm ni yoqish
        run: corepack enable

      - name: Frontend bog'liqliklari
        run: pnpm install --frozen-lockfile
        working-directory: webapp

      - name: Frontendni yig'ish
        run: pnpm run build
        working-directory: webapp

      - name: Statik fayllarni yuklash
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "webapp/dist/*"
          target: /var/www/davomat
          strip_components: 2

      # ─── Backend ─────────────────────────────────────────────────────────
      - name: Backendni yangilash va xizmatlarni qayta ishga tushirish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/DavomatBot/bot

            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt

            # Sxema o'zgarishlari Alembic orqali qo'llanadi.
            # Eski bazada birinchi marta: alembic stamp 0001
            alembic upgrade head

            systemctl restart davomat davomat-api

            # Deploy yashil ko'rinib, xizmat o'chiq turmasligi uchun
            sleep 5
            systemctl is-active --quiet davomat
            systemctl is-active --quiet davomat-api
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null

            echo "Deploy tugadi: bot va API ishlayapti."
